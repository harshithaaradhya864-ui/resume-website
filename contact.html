<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title> 
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="resume.html">Resume</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
         <h1>Contact Me</h1>
        <section class="contact-section">
            <h2>Get In Touch!</h2>
            <p>I'd love to hear from you regarding job opportunities, project collaborations, or just a quick chat.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Full Name" required>
                    <small class="error-message" id="nameError"></small>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <small class="error-message" id="emailError"></small>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
                    <small class="error-message" id="subjectError"></small>
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" placeholder="Your message here..." required></textarea>
                    <small class="error-message" id="messageError"></small>
                </div>
                
                <button type="submit" id="submitBtn">Send Message</button>
                <p id="formStatus" style="display: none; margin-top: 15px; font-weight: bold;"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Harshitha B A. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
